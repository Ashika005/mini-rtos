name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain and QEMU
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi qemu-system-arm
      - name: Build and run kernel tests
        run: make clean && make test
      - name: Negative test (priority inheritance disabled must fail)
        run: make test-no-inherit
